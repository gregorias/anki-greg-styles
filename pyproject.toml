[project]
name = "anki-greg-styles"
version = "25.04.0"
description = "Anki add-on with my card styles"
authors = [{ name = "Grzegorz Milka", email = "grzegorzmilka@gmail.com" }]
# Use 3.13, because that’s what Anki uses
# (https://github.com/ankitects/anki/releases/tag/25.07).
requires-python = ">=3.13.5, <3.14"
readme = "README.md"
license = "AGPLv3"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
]
dependencies = [
  # https://pypi.org/project/anki/
  "anki==26.9.4",
  # https://pypi.org/project/aqt/
  "aqt==26.9.4",
  # Use the same version of PyQt6 as Anki:
  # https://github.com/ankitects/anki/blob/main/qt/pyproject.toml
  "pyqt6==6.11.0",
  "pyqt6-qt6==6.11.2",
  "PyQt6-WebEngine==6.11.0",
  "PyQt6-WebEngine-qt6==6.11.2",
]

[project.urls]
Repository = "https://github.com/gregorias/anki-greg-styles"

[dependency-groups]
dev = ["mypy>=2.1.0", "vulture~=2.16", "coverage"]

[tool.uv]
# We use Python only for the dependency management, not for packaging.
# This is because Anki plugins are distributed as zipped directories, not as wheels.
package = false

[tool.mypy]
python_version = "3.13"
